{% extends 'usuarios/base.html' %}
{% block conteudo %}
<div class="container">
    <h1>Quantidade de Encomendas:</h1>
    <table class="table table-bordered table-striped">
        <tr>
            <th>nome</th>
            <th>email</th>
        </tr>
        {% for usuario in usuarios %}
        <tr>
            <td>{{usuario.nome_usuario}}</td>
            <td>{{usuario.email_usuario}}</td>
        </tr>
        {% endfor %}
    </table>
</div>

{% endblock %}
